<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2330;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #7d8590;
      --green: #3fb950;
      --green-dim: #196127;
      --red: #f85149;
      --red-dim: #6e1b19;
      --blue: #58a6ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    a { color: var(--blue); }
    a:hover { color: #79b8ff; }
    .field-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; }
    .input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: var(--bg); color: var(--text); font-size: 14px; display: flex; flex-direction: column; overflow: hidden;">

  <!-- Header -->
  <div style="flex-shrink: 0; background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;">
    <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.2px;">New Trade Idea</div>
    <div style="width: 36px; height: 36px; border-radius: 9px; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7d8590" stroke-width="2.2" stroke-linecap="round">
        <line x1="5" y1="5" x2="19" y2="19"></line>
        <line x1="19" y1="5" x2="5" y2="19"></line>
      </svg>
    </div>
  </div>

  <!-- Form -->
  <div style="flex-grow: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px;">

    <!-- Ticker -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div class="field-label">Ticker</div>
      <div class="input" style="font-size: 20px; font-weight: 700; letter-spacing: 0.5px; color: var(--muted);">e.g. NVDA</div>
    </div>

    <!-- Spread type -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div class="field-label">Spread Type</div>
      <div style="display: flex; gap: 8px;">
        <div style="flex-grow: 1; text-align: center; padding: 11px 0; border-radius: 8px; background: var(--green-dim); border: 1px solid var(--green); color: var(--green); font-weight: 700; font-size: 14px;">Call Spread</div>
        <div style="flex-grow: 1; text-align: center; padding: 11px 0; border-radius: 8px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-weight: 600; font-size: 14px;">Put Spread</div>
      </div>
    </div>

    <!-- Expiration -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div class="field-label">Expiration</div>
      <div class="input" style="display: flex; align-items: center; justify-content: space-between;">
        <span>Oct 16, 2026</span>
        <span style="display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px;">
          48 DTE
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7d8590" stroke-width="2">
            <rect x="3" y="5" width="18" height="16" rx="2"></rect>
            <line x1="3" y1="10" x2="21" y2="10"></line>
            <line x1="8" y1="3" x2="8" y2="7"></line>
            <line x1="16" y1="3" x2="16" y2="7"></line>
          </svg>
        </span>
      </div>
    </div>

    <!-- Strikes -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div class="field-label">Strikes</div>
      <div style="display: flex; gap: 10px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
          <div style="font-size: 11px; color: var(--muted);">Long Strike</div>
          <div class="input">185</div>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
          <div style="font-size: 11px; color: var(--muted);">Short Strike</div>
          <div class="input">190</div>
        </div>
      </div>
      <div style="font-size: 12px; color: var(--muted); padding-top: 2px;">$5 wide</div>
    </div>

    <!-- Target debit -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div class="field-label">Ideal Premium (Debit)</div>
      <div class="input" style="display: flex; align-items: center; gap: 4px; font-size: 18px; font-weight: 700; color: var(--blue);">
        <span style="color: var(--muted); font-weight: 500; font-size: 16px;">$</span>2.15
      </div>
    </div>

  </div>

  <!-- Save button -->
  <div style="flex-shrink: 0; padding: 14px 16px 20px; border-top: 1px solid var(--border); background: var(--surface);">
    <div style="background: var(--green); color: #06240d; text-align: center; padding: 14px 0; border-radius: 10px; font-weight: 700; font-size: 15px;">Save Trade Idea</div>
  </div>

</div>
</x-dc>
</body>
</html>
