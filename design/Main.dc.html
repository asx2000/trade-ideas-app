<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2330;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #7d8590;
      --green: #3fb950;
      --green-dim: #196127;
      --red: #f85149;
      --red-dim: #6e1b19;
      --blue: #58a6ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    a { color: var(--blue); }
    a:hover { color: #79b8ff; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: var(--bg); color: var(--text); font-size: 14px; display: flex; flex-direction: column; overflow: hidden;">

  <!-- Header -->
  <div style="flex-shrink: 0; background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
    <div style="width: 44px; height: 44px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2.2" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
      <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.2px;">Session Plan</div>
      <div style="font-size: 12px; color: var(--muted);">Debit Spreads &middot; Mon, Aug 31</div>
    </div>
    <div style="font-size: 11px; font-weight: 700; color: var(--muted); background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 4px 10px; flex-shrink: 0;">3 QUEUED</div>
  </div>

  <!-- List -->
  <div style="flex-grow: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;">

    <!-- Card: NVDA call spread -->
    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 21px; font-weight: 700; letter-spacing: -0.3px;">NVDA</div>
        <div style="font-size: 11px; font-weight: 700; color: var(--green); background: var(--green-dim); border-radius: 10px; padding: 3px 10px;">CALL SPREAD</div>
      </div>
      <div style="display: flex; align-items: flex-end; justify-content: space-between;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px;">Strikes</div>
          <div style="font-size: 15px; font-weight: 600;">185 / 190 <span style="color: var(--muted); font-weight: 500;">&middot; $5 wide</span></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; align-items: flex-end;">
          <div style="font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px;">Target Debit</div>
          <div style="font-size: 15px; font-weight: 700; color: var(--blue);">$2.15</div>
        </div>
      </div>
      <div style="font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 10px;">Exp Oct 16 &middot; 48 DTE</div>
    </div>

    <!-- Card: AMD call spread -->
    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 21px; font-weight: 700; letter-spacing: -0.3px;">AMD</div>
        <div style="font-size: 11px; font-weight: 700; color: var(--green); background: var(--green-dim); border-radius: 10px; padding: 3px 10px;">CALL SPREAD</div>
      </div>
      <div style="display: flex; align-items: flex-end; justify-content: space-between;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px;">Strikes</div>
          <div style="font-size: 15px; font-weight: 600;">165 / 170 <span style="color: var(--muted); font-weight: 500;">&middot; $5 wide</span></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; align-items: flex-end;">
          <div style="font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px;">Target Debit</div>
          <div style="font-size: 15px; font-weight: 700; color: var(--blue);">$1.95</div>
        </div>
      </div>
      <div style="font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 10px;">Exp Oct 9 &middot; 41 DTE</div>
    </div>

    <!-- Card: SPY put spread -->
    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 21px; font-weight: 700; letter-spacing: -0.3px;">SPY</div>
        <div style="font-size: 11px; font-weight: 700; color: var(--red); background: var(--red-dim); border-radius: 10px; padding: 3px 10px;">PUT SPREAD</div>
      </div>
      <div style="display: flex; align-items: flex-end; justify-content: space-between;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px;">Strikes</div>
          <div style="font-size: 15px; font-weight: 600;">555 / 550 <span style="color: var(--muted); font-weight: 500;">&middot; $5 wide</span></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; align-items: flex-end;">
          <div style="font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px;">Target Debit</div>
          <div style="font-size: 15px; font-weight: 700; color: var(--blue);">$2.30</div>
        </div>
      </div>
      <div style="font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 10px;">Exp Oct 16 &middot; 45 DTE</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
